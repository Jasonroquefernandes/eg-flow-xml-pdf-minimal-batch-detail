<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>Din faktura {{invoice_number}} fra {{vendor}}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px 24px 8px;">
          <img src="{{logo}}" alt="{{vendor}}" style="max-height:48px;" />
        </td>
      </tr>
      <tr>
        <td style="padding:8px 24px;">
          <h1 style="font-size:20px;margin:0 0 12px;">Din faktura {{invoice_number}}</h1>
          <p style="margin:0 0 12px;line-height:1.5;">Hej {{customer_name}}, din faktura fra {{vendor}} er vedhæftet denne mail.</p>
          <p style="margin:0;line-height:1.5;">Fakturadato: {{invoice_date}}<br />Forfaldsdato: {{due_date}}</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 24px 24px;color:#5c5c5c;font-size:12px;">{{vendor}}</td>
      </tr>
    </table>
  </body>
</html>
